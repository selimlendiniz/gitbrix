# Builds the Windows installers on demand: Actions tab, "windows", Run workflow.
# They come out as an artifact of the run and aren't code signed, so Windows
# warns about an unknown publisher when they are started.

name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to commits, since a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versions come from mise.toml; tauri-driver is only for the Linux e2e tests.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm rust

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitbrix-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
